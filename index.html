<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活力美髮學堂 - 維度躍遷戰略</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Noto Serif TC', serif; 
            overflow: hidden; 
            background: #fff;
        }
        
        /* 幻彩流體背景 */
        .app-container {
            display: flex; 
            flex-direction: column;
            height: 100vh;
            background: white linear-gradient(135deg, #fff 0%, #fef4f2 20%, #fbc2eb 50%, #a1c4fd 80%, #c2e9fb 100%);
            background-attachment: fixed;
        }

        /* --- 電腦版導航 (極簡紫色加粗版) --- */
        .nav-header {
            width: 100%; height: 80px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(30px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 1000;
        }
        .nav-box { display: flex; gap: 30px; align-items: center; }
        .nav-item { 
            padding: 10px 5px; cursor: pointer; 
            color: #6c5ce7; /* 預設紫色 */
            letter-spacing: 2px; transition: all 0.2s ease; 
            font-weight: 600; /* 全部加粗 */
            font-size: 1rem;
            border-bottom: none !important; /* 強制移除底線 */
            text-decoration: none;
        }
        /* 選中時變為更粗 (900) */
        .nav-item.active { 
            color: #6c5ce7; 
            font-weight: 900; 
            border-bottom: none !important; 
            transform: scale(1.05);
        }
        
        .btn-link {
            text-decoration: none; background: #6c5ce7; color: #fff !important;
            padding: 8px 18px; border-radius: 50px; font-size: 0.85rem;
            transition: 0.3s; letter-spacing: 2px; font-weight: 600;
        }
        .btn-link:hover { opacity: 0.8; transform: translateY(-2px); }

        /* --- 內容主視窗 --- */
        #content-target { 
            flex: 1; width: 100%; overflow-y: auto; 
            padding: 40px 0 100px 0; 
            display: flex; flex-direction: column; align-items: center;
            scroll-behavior: smooth;
        }

        .header-section {
            width: 88%; max-width: 800px; margin-bottom: 40px;
            text-align: left;
            opacity: 0; transform: translateX(-20px);
            animation: fadeInLeft 0.8s forwards;
        }
        .main-title { 
            font-size: 2.5rem; color: #1a1a1a; 
            font-weight: 400; 
            letter-spacing: 12px;
            margin: 0; 
        }
        .sub-tag {
            display: inline-block; background: #6c5ce7; color: #fff;
            padding: 4px 12px; border-radius: 4px; font-size: 0.7rem;
            letter-spacing: 3px; margin-top: 15px;
            font-family: 'Noto Sans TC';
        }

        .content-card {
            max-width: 800px; width: 88%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(40px);
            border-radius: 35px;
            padding: 60px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            transition: all 0.5s ease;
        }

        .section-sub-title {
            font-size: 1.4rem; color: #111; font-weight: 600;
            margin-bottom: 25px; display: block; letter-spacing: 1px;
        }
        .article-text {
            font-size: 1.25rem; color: #000; line-height: 2.2;
            font-weight: 400; margin-bottom: 35px; text-align: justify;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 25px; padding: 40px;
            border-left: 6px solid #6c5ce7;
            margin: 40px 0; font-size: 1.3rem;
        }

        .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
        .vs-card { display: flex; flex-direction: column; gap: 15px; }
        .vs-card.premium { 
            background: rgba(108, 92, 231, 0.08); padding: 25px; 
            border-radius: 20px; border: 1px solid rgba(108, 92, 231, 0.1);
        }
        .vs-head { font-size: 0.9rem; color: #666; font-weight: 600; letter-spacing: 2px; }
        .vs-body { font-size: 1.15rem; color: #000; line-height: 1.8; }

        /* --- 手機底部導航 --- */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); width: 92%; max-width: 450px;
            height: 65px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px); border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 2000; justify-content: space-around; align-items: center;
        }
        .m-nav-item { 
            flex: 1; text-align: center; 
            color: #6c5ce7; /* 手機版也是紫色 */
            font-size: 0.85rem; cursor: pointer; 
            font-weight: 600;
            text-decoration: none;
        }
        .m-nav-item.active { font-weight: 900; }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .nav-header { display: none; }
            .mobile-bottom-nav { display: flex; }
            .content-card { padding: 40px 25px; border-radius: 30px; }
            .main-title { font-size: 1.8rem; letter-spacing: 8px; }
            .vs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="nav-header">
        <div class="nav-box" id="pc-nav"></div>
    </header>

    <main id="content-target">
        <div class="header-section">
            <h1 id="page-main-title" class="main-title">合作價值提案</h1>
            <div id="page-tag" class="sub-tag">VALUE PROPOSITION</div>
        </div>

        <div class="content-card" id="page-content"></div>
    </main>

    <nav class="mobile-bottom-nav" id="mobile-nav"></nav>
</div>

<script>
    const pages = [
        {
            tag: "STRATEGY", title: "合作價值提案",
            content: `
                <span class="section-sub-title">何謂美髮業極少人能做到的「維度提升」</span>
                <div class="article-text">
                    在美髮產業中，絕大多數人的成長邏輯是<b>「線性的」</b>：技術更好→收費更高→開店。<br><br>
                    而我所做的「維度提升」，是直接打破這個天花板，從勞力競爭躍遷到系統競爭。
                </div>
                <div class="quote-box">
                    <b style="color:#6c5ce7; display:block; margin-bottom:15px; font-size:1.4rem;">維度提升 = 降維打擊</b>
                    透過「書本」+「App」+「公司化」三位一體系統。我們要的不是更多的工作，而是一個<b>新的生命維度</b>。
                </div>
            `
        },
        { tag: "DEVELOPER", title: "系統開發者", content: `<span class="section-sub-title">從手藝人到系統開發者</span><div class="vs-grid"><div class="vs-card"><span class="vs-head">一般人：手藝思維</span><div class="vs-body">專研技術，成為名師。這依然是用「時間換錢」。</div></div><div class="vs-card premium"><span class="vs-head">我的維度：開發思維</span><div class="vs-body">經營邏輯寫成了 <b>8 個 App</b>。提供自動運行的獲利工具。</div></div></div>` },
        { tag: "PLATFORM", title: "平台生態", content: `<span class="section-sub-title">從個體教學到平台生態</span><div class="vs-grid"><div class="vs-card"><span class="vs-head">一般人：教學思維</span><div class="vs-body">學生學完就走，甚至變成競爭對手。</div></div><div class="vs-card premium"><span class="vs-head">我的維度：生態思維</span><div class="vs-body">建立「活力美髮學堂」。設計專案講師制度，我是基礎設施提供者。</div></div></div>` },
        { tag: "LEVERAGE", title: "數位槓桿", content: `<span class="section-sub-title">從實體資產到數位槓桿</span><div class="vs-grid"><div class="vs-card"><span class="vs-head">一般人：資產思維</span><div class="vs-body">擴張就得借錢開分店，背負龐大成本。</div></div><div class="vs-card premium"><span class="vs-head">我的維度：槓桿思維</span><div class="vs-body">透過線上課程無限複製。用網路結合實體店面。</div></div></div>` },
        { tag: "DATA", title: "數據資產", content: `<span class="section-sub-title">從主觀經驗到數據資產</span><div class="vs-grid"><div class="vs-card"><span class="vs-head">一般人：感覺經營</span><div class="vs-body">經營靠感覺，利潤月底看存摺才知道。</div></div><div class="vs-card premium"><span class="vs-head">我的維度：數據權威</span><div class="vs-body">透過 8 個 App 將模糊經驗轉化為精確數據。回流與分潤一目瞭然。</div></div></div>` }
    ];

    const menu = ["提案", "系統", "生態", "槓桿", "數據"];

    function initNavs() {
        const pc = document.getElementById('pc-nav');
        const mb = document.getElementById('mobile-nav');
        
        // 電腦版
        let pcHtml = menu.map((name, i) => {
            let item = `<div class="nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`;
            if(i === 0) item += `<a href="策略.html" class="btn-link">策略.html</a>`;
            return item;
        }).join('');
        
        // 手機版
        let mbHtml = menu.map((name, i) => {
            let item = `<div class="m-nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`;
            if(i === 0) item += `<a href="策略.html" class="m-nav-item" style="color:#6c5ce7; font-weight:900;">策略</a>`;
            return item;
        }).join('');

        pc.innerHTML = pcHtml;
        mb.innerHTML = mbHtml;
    }

    function loadPage(idx) {
        const target = document.getElementById('page-content');
        const title = document.getElementById('page-main-title');
        const tag = document.getElementById('page-tag');
        target.style.opacity = 0;
        setTimeout(() => {
            title.innerText = pages[idx].title;
            tag.innerText = pages[idx].tag;
            target.innerHTML = pages[idx].content;
            target.style.opacity = 1;
            
            // 刷新 Active 狀態 (PC)
            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            // 刷新 Active 狀態 (Mobile)
            document.querySelectorAll('#mobile-nav .m-nav-item').forEach((el, i) => {
                // 因為手機版多了個 A 標籤，索引需小心處理，這裡簡單以文字判斷或直接對應
                if(el.innerText === menu[idx]) el.classList.add('active');
                else if(menu.includes(el.innerText)) el.classList.remove('active');
            });
            
            document.getElementById('content-target').scrollTop = 0;
        }, 300);
    }

    initNavs();
    loadPage(0);
</script>

</body>
</html>
