<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活力美髮學堂 - 維度躍遷戰略</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;400;600&family=Noto+Sans+TC:wght@300;400&display=swap');

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Noto Serif TC', serif; 
            overflow: hidden; 
            background: #fff;
        }
        
        .app-container {
            display: flex; 
            flex-direction: column;
            height: 100vh;
            background: white linear-gradient(135deg, #fff 0%, #fef4f2 20%, #fbc2eb 50%, #a1c4fd 80%, #c2e9fb 100%);
            background-attachment: fixed;
        }

        /* --- 導航列 --- */
        .nav-header {
            width: 100%; height: 80px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(30px); 
            z-index: 1000;
        }
        .nav-box { display: flex; gap: 30px; }
        .nav-item { 
            padding: 10px 15px; cursor: pointer; color: #666;
            letter-spacing: 3px; transition: 0.5s; font-weight: 300; font-size: 0.9rem;
        }
        .nav-item.active { color: #6c5ce7; font-weight: 600; border-bottom: 1px solid #6c5ce7; }

        /* --- 內容主視窗 --- */
        #content-target { 
            flex: 1; width: 100%; overflow-y: auto; 
            padding: 60px 0 120px 0; 
            display: flex; flex-direction: column; align-items: center;
            scroll-behavior: smooth;
        }

        /* 標題區塊：柔美化優化 */
        .header-section {
            width: 85%; max-width: 800px; margin-bottom: 50px;
            text-align: center; opacity: 0;
            animation: fadeIn 1.2s forwards;
        }
        .main-title { 
            font-size: 2.8rem; 
            color: #333; 
            font-weight: 200; /* 極細體，展現柔美感 */
            letter-spacing: 18px; /* 極大字距，營造文創呼吸感 */
            margin: 0; 
            line-height: 1.5;
        }
        
        /* 移除原本標題上的紫標，改為精緻的頁碼感 */
        .page-indicator {
            font-size: 0.7rem; color: #6c5ce7; letter-spacing: 5px;
            margin-top: 20px; font-family: 'Noto Sans TC'; opacity: 0.6;
        }

        /* 內容卡片 */
        .content-card {
            max-width: 750px; width: 88%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px);
            border-radius: 40px;
            padding: 60px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            transition: all 0.6s ease;
        }

        .section-sub-title {
            font-size: 1.3rem; color: #444; font-weight: 400;
            margin-bottom: 30px; display: block; letter-spacing: 2px;
            text-align: center; position: relative;
        }
        .section-sub-title::after {
            content: ''; display: block; width: 30px; height: 1px; 
            background: #6c5ce7; margin: 15px auto 0;
        }

        .article-text {
            font-size: 1.2rem; color: #222; line-height: 2.4;
            font-weight: 400; margin-bottom: 35px; text-align: justify;
            letter-spacing: 1px;
        }

        /* 特別強調框：柔和化 */
        .quote-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px; padding: 40px;
            border: 1px dashed rgba(108, 92, 231, 0.3);
            margin: 40px 0; font-size: 1.25rem; color: #444;
            text-align: center; line-height: 2.2;
        }

        /* 對比網格 */
        .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
        .vs-card { display: flex; flex-direction: column; gap: 15px; }
        .vs-card.premium { 
            background: rgba(108, 92, 231, 0.04); padding: 25px; 
            border-radius: 20px; border: 1px solid rgba(108, 92, 231, 0.05);
        }
        .vs-head { font-size: 0.8rem; color: #888; font-weight: 400; letter-spacing: 2px; }
        .vs-body { font-size: 1.1rem; color: #333; line-height: 1.8; }

        /* --- 手機底部導航 --- */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); width: 85%; max-width: 380px;
            height: 60px; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 2000;
            justify-content: space-around; align-items: center;
        }
        .m-nav-item {
            flex: 1; text-align: center; color: #999; font-size: 0.8rem;
            font-weight: 400; cursor: pointer; transition: 0.4s; letter-spacing: 1px;
        }
        .m-nav-item.active { color: #6c5ce7; font-weight: 600; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-header { display: none; }
            .mobile-bottom-nav { display: flex; }
            .content-card { padding: 45px 25px; border-radius: 35px; }
            .main-title { font-size: 1.6rem; letter-spacing: 8px; }
            .article-text { font-size: 1.1rem; }
            .vs-grid { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="nav-header">
        <div class="nav-box" id="pc-nav"></div>
    </header>

    <main id="content-target">
        <div class="header-section">
            <h1 id="page-main-title" class="main-title">合作價值提案</h1>
            <div id="page-tag" class="page-indicator">STRATEGY 01</div>
        </div>

        <div class="content-card" id="page-content"></div>
    </main>

    <nav class="mobile-bottom-nav" id="mobile-nav"></nav>
</div>

<script>
    const pages = [
        {
            tag: "CHAPTER. 01 / PROPOSITION", title: "合作價值提案",
            content: `
                <span class="section-sub-title">何謂美髮業極少人能做到的「維度提升」</span>
                <div class="article-text">
                    在美髮產業中，絕大多數人的成長邏輯是<b>「線性的」</b>：技術更好→收費更高→開店。<br><br>
                    而我所做的「維度提升」，是直接打破這個天花板，從勞力競爭躍遷到系統競爭。這不是努力的結果，而是維度的進化。
                </div>
                <div class="quote-box">
                    <b style="color:#6c5ce7; display:block; margin-bottom:15px; font-weight:600;">維度提升 = 降維打擊</b>
                    透過「書本」+「App」+「公司化」三位一體系統在俯瞰戰場。<br><br>
                    我們要的不是更多的工作，而是一個新的生命維度。
                </div>
            `
        },
        {
            tag: "CHAPTER. 02 / DEVELOPER", title: "系統開發者",
            content: `
                <span class="section-sub-title">從手藝人到系統開發者</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：手藝思維</span>
                        <div class="vs-body">專研技術，成為名師。這依然是用「時間換錢」，手停，錢就停。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：開發思維</span>
                        <div class="vs-body">設計產業大腦。經營邏輯寫成了 <b>8 個 App</b>。我直接給你們一套自動運行的獲利工具。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "CHAPTER. 03 / PLATFORM", title: "平台生態",
            content: `
                <span class="section-sub-title">從個體教學到平台生態</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：教學思維</span>
                        <div class="vs-body">學生學完就走，甚至變成競爭對手。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：生態思維</span>
                        <div class="vs-body">建立活力平台，設計專案講師制度。我成了美業的<b>基礎設施提供者</b>。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "CHAPTER. 04 / LEVERAGE", title: "數位槓桿",
            content: `
                <span class="section-sub-title">從實體資產到數位槓桿</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：資產思維</span>
                        <div class="vs-body">擴張得借錢開分店，背負龐大房租與人事成本。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：槓桿思維</span>
                        <div class="vs-body">透過線上課程無限複製。結合<b>天羅地網</b>策略，讓客人從雲端走向妳。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "CHAPTER. 05 / DATA", title: "數據資產",
            content: `
                <span class="section-sub-title">從主觀經驗到數據資產</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：感覺經營</span>
                        <div class="vs-body">經營靠感覺，利潤剩多少通常要到月底才知。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：數據權威</span>
                        <div class="vs-body">透過 8 個 App 將模糊經驗轉化為精確數據。時代就在妳的腳下。</div>
                    </div>
                </div>
            `
        }
    ];

    const menu = ["提案", "系統", "生態", "槓桿", "數據"];

    function initNavs() {
        const pc = document.getElementById('pc-nav');
        const mb = document.getElementById('mobile-nav');
        pc.innerHTML = menu.map((name, i) => `<div class="nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`).join('');
        mb.innerHTML = menu.map((name, i) => `<div class="m-nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`).join('');
    }

    function loadPage(idx) {
        const target = document.getElementById('page-content');
        const title = document.getElementById('page-main-title');
        const tag = document.getElementById('page-tag');
        target.style.opacity = 0;
        setTimeout(() => {
            title.innerText = pages[idx].title;
            tag.innerText = pages[idx].tag;
            target.innerHTML = pages[idx].content;
            target.style.opacity = 1;
            document.querySelectorAll('.nav-item, .m-nav-item').forEach((el, i) => {
                el.classList.toggle('active', (i % 5) === idx);
            });
            document.getElementById('content-target').scrollTop = 0;
        }, 300);
    }

    initNavs();
    loadPage(0);
</script>

</body>
</html>
