<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活力美髮學堂 - 維度躍遷戰略</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap');

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Noto Serif TC', serif; 
            overflow: hidden; 
            background: #fff;
        }
        
        /* 幻彩流體背景 */
        .app-container {
            display: flex; 
            flex-direction: column;
            height: 100vh;
            background: white linear-gradient(135deg, #fff 0%, #fef4f2 20%, #fbc2eb 50%, #a1c4fd 80%, #c2e9fb 100%);
            background-attachment: fixed;
        }

        /* --- 電腦版導航 --- */
        .nav-header {
            width: 100%; height: 80px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(30px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 1000;
        }
        .nav-box { display: flex; gap: 30px; }
        .nav-item { 
            padding: 10px 20px; cursor: pointer; color: #444;
            letter-spacing: 2px; transition: 0.3s; font-weight: 500; font-size: 1rem;
        }
        .nav-item.active { color: #6c5ce7; border-bottom: 2px solid #6c5ce7; font-weight: 900; }

        /* --- 內容主視窗 --- */
        #content-target { 
            flex: 1; width: 100%; overflow-y: auto; 
            padding: 40px 0 100px 0; 
            display: flex; flex-direction: column; align-items: center;
            scroll-behavior: smooth;
        }

        /* 標題區塊：藝術化優化 */
        .header-section {
            width: 85%; max-width: 800px; margin-bottom: 30px;
            text-align: center; opacity: 0; transform: translateY(-20px);
            animation: fadeInDown 0.8s forwards;
        }
        .main-title { 
            font-size: 2.4rem; 
            color: #1a1a1a; /* 帶質感的深黑 */
            font-weight: 900; 
            letter-spacing: 10px; /* 拉大字距增加藝術感 */
            margin: 0; 
            text-shadow: 2px 2px 10px rgba(108, 92, 231, 0.1); /* 隱約的紫色光暈 */
        }
        .sub-tag {
            display: inline-block; background: #6c5ce7; color: #fff;
            padding: 5px 20px; border-radius: 50px; font-size: 0.75rem;
            letter-spacing: 3px; margin-top: 15px; font-family: 'Noto Sans TC';
            opacity: 0.8;
        }

        /* 內容卡片：多重毛玻璃 */
        .content-card {
            max-width: 800px; width: 88%;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(40px);
            border-radius: 35px;
            padding: 60px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            transition: all 0.5s ease;
        }

        .section-sub-title {
            font-size: 1.4rem; color: #111; font-weight: 600;
            margin-bottom: 25px; display: block; letter-spacing: 1px;
            border-left: 4px solid #6c5ce7; padding-left: 15px; /* 增加點綴 */
        }
        .article-text {
            font-size: 1.25rem; color: #000; line-height: 2.2;
            font-weight: 400; margin-bottom: 35px; text-align: justify;
        }

        /* 特別強調框 */
        .quote-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 25px; padding: 40px;
            border-left: 6px solid #6c5ce7;
            margin: 40px 0; font-size: 1.3rem;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
        }

        /* 對比網格 */
        .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
        .vs-card { display: flex; flex-direction: column; gap: 15px; }
        .vs-card.premium { 
            background: rgba(108, 92, 231, 0.08); padding: 25px; 
            border-radius: 20px; border: 1px solid rgba(108, 92, 231, 0.1);
        }
        .vs-head { font-size: 0.9rem; color: #666; font-weight: 600; letter-spacing: 2px; }
        .vs-body { font-size: 1.15rem; color: #000; line-height: 1.8; }

        /* --- 手機底部導航 --- */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); width: 90%; max-width: 400px;
            height: 65px; background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 2000;
            justify-content: space-around; align-items: center; padding: 0 10px;
        }
        .m-nav-item {
            flex: 1; text-align: center; color: #888; font-size: 0.8rem;
            font-weight: 500; cursor: pointer; transition: 0.3s;
        }
        .m-nav-item.active { color: #6c5ce7; font-weight: 900; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-header { display: none; }
            .mobile-bottom-nav { display: flex; }
            .content-card { padding: 40px 25px; border-radius: 30px; }
            .main-title { font-size: 1.8rem; letter-spacing: 5px; }
            .article-text { font-size: 1.15rem; }
            .vs-grid { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="nav-header">
        <div class="nav-box" id="pc-nav"></div>
    </header>

    <main id="content-target">
        <div class="header-section">
            <div id="page-tag" class="sub-tag">VALUE PROPOSITION</div>
            <h1 id="page-main-title" class="main-title">合作價值提案</h1>
        </div>

        <div class="content-card" id="page-content"></div>
    </main>

    <nav class="mobile-bottom-nav" id="mobile-nav"></nav>
</div>

<script>
    const pages = [
        {
            tag: "STRATEGY", title: "合作價值提案",
            content: `
                <span class="section-sub-title">何謂美髮業極少人能做到的「維度提升」</span>
                <div class="article-text">
                    在美髮產業中，絕大多數人的成長邏輯是<b>「線性的」</b>：技術更好→收費更高→開店（投入更多勞力）。<br><br>
                    而我所做的「維度提升」，是直接打破這個天花板，從勞力競爭躍遷到系統競爭。具體來說，我完成了以下四個維度的跨越：
                </div>
                <div class="quote-box">
                    <b style="color:#6c5ce7; display:block; margin-bottom:15px; font-size:1.4rem;">維度提升 = 降維打擊</b>
                    當其他美髮人還在泥淖裡辛苦勞作時，我是站在高處，透過「書本」+「App」+「公司化」三位一體系統在俯瞰戰場。<br><br>
                    我們要的不是更多的工作，而是一個<b>新的生命維度</b>。
                </div>
            `
        },
        {
            tag: "DEVELOPER", title: "系統開發者",
            content: `
                <span class="section-sub-title">從手藝人到系統開發者</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：手藝思維</span>
                        <div class="vs-body">目標是成為名師。這依然是用「時間換錢」，手停，錢就停。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：開發思維</span>
                        <div class="vs-body">設計產業大腦。經營邏輯寫成了 <b>8 個 App</b>。我直接給你們自動運行的獲獲利工具。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "PLATFORM", title: "平台生態",
            content: `
                <span class="section-sub-title">從個體教學到平台生態</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：教學思維</span>
                        <div class="vs-body">開課教學生，學生學完就走，甚至變成競爭對手。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：生態思維</span>
                        <div class="vs-body">建立活力平台，設計<b>專案講師制度</b>。我成了美業的基礎設施提供者。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "LEVERAGE", title: "數位槓桿",
            content: `
                <span class="section-sub-title">從實體資產到數位槓桿</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：資產思維</span>
                        <div class="vs-body">擴張就得借錢開分店，背負龐大房租與人事成本。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：槓桿思維</span>
                        <div class="vs-body">透過線上課程無限複製。結合<b>天羅地網</b>策略，讓客人來自全網。</div>
                    </div>
                </div>
            `
        },
        {
            tag: "DATA", title: "數據資產",
            content: `
                <span class="section-sub-title">從主觀經驗到數據資產</span>
                <div class="vs-grid">
                    <div class="vs-card">
                        <span class="vs-head">一般人：感覺經營</span>
                        <div class="vs-body">經營靠感覺，利潤剩多少通常要到月底看存摺才知道。</div>
                    </div>
                    <div class="vs-card premium">
                        <span class="vs-head">我的維度：數據權威</span>
                        <div class="vs-body">透過 8 個 App 將模糊經驗轉化為精確數據。時代就在妳的腳下。</div>
                    </div>
                </div>
            `
        }
    ];

    const menu = ["提案", "系統", "生態", "槓桿", "數據"];

    function initNavs() {
        const pc = document.getElementById('pc-nav');
        const mb = document.getElementById('mobile-nav');
        pc.innerHTML = menu.map((name, i) => `<div class="nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`).join('');
        mb.innerHTML = menu.map((name, i) => `<div class="m-nav-item ${i===0?'active':''}" onclick="loadPage(${i})">${name}</div>`).join('');
    }

    function loadPage(idx) {
        const target = document.getElementById('page-content');
        const title = document.getElementById('page-main-title');
        const tag = document.getElementById('page-tag');
        target.style.opacity = 0;
        setTimeout(() => {
            title.innerText = pages[idx].title;
            tag.innerText = pages[idx].tag;
            target.innerHTML = pages[idx].content;
            target.style.opacity = 1;
            document.querySelectorAll('.nav-item, .m-nav-item').forEach((el, i) => {
                el.classList.toggle('active', (i % 5) === idx);
            });
            document.getElementById('content-target').scrollTop = 0;
        }, 300);
    }

    initNavs();
    loadPage(0);
</script>

</body>
</html>
