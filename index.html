<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活力美髮學堂 - 藝術維度</title>
    <style>
        /* 引入具有藝術感的宋體/明體 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;400;700;900&display=swap');

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Noto Serif TC', serif; 
            background: #fff; color: #1a1a1a;
            overflow: hidden;
        }

        /* 幻彩流體：更柔和的藝術色調 */
        .app-container {
            display: flex; flex-direction: column; height: 100vh;
            background: radial-gradient(circle at top left, #fff 0%, #fdf2f0 30%, #fbc2eb 60%, #a1c4fd 90%);
            background-attachment: fixed;
        }

        /* 頂部導航：極簡藝術感 */
        .nav-header {
            width: 100%; height: 90px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            z-index: 1000;
        }
        .nav-box { display: flex; gap: 40px; }
        .nav-item { 
            cursor: pointer; color: #666; font-size: 0.9rem;
            letter-spacing: 4px; transition: 0.5s; font-weight: 200;
        }
        .nav-item.active { color: #000; font-weight: 700; transform: scale(1.1); }

        /* 內容區 */
        #content-target { 
            flex: 1; width: 100%; overflow-y: auto; padding: 20px 0 120px 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 標題藝術化：拉開字距、錯落感 */
        .art-header {
            width: 85%; max-width: 800px; margin-top: 40px; margin-bottom: 60px;
            text-align: left; padding-left: 20px;
        }
        .art-tag {
            font-size: 0.7rem; letter-spacing: 8px; color: #6c5ce7;
            display: block; margin-bottom: 15px; opacity: 0.8;
        }
        .art-main-title {
            font-size: 2.6rem; font-weight: 900; letter-spacing: 12px;
            line-height: 1.2; margin: 0; position: relative;
            color: transparent; -webkit-text-stroke: 1px #000; /* 空心藝術字初探 */
            background: linear-gradient(to right, #000, #444);
            -webkit-background-clip: text; color: #000;
        }

        /* 毛玻璃內容卡片 */
        .art-card {
            width: 85%; max-width: 750px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(40px);
            border-radius: 2px; /* 方正顯得更有文創感 */
            padding: 60px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.6);
            margin-bottom: 40px;
            animation: slideUp 1s ease-out;
        }

        .section-title {
            font-size: 1.5rem; color: #111; font-weight: 700;
            margin-bottom: 40px; letter-spacing: 4px; border-bottom: 1px solid #000;
            display: inline-block; padding-bottom: 10px;
        }

        .art-p {
            font-size: 1.2rem; line-height: 2.5; font-weight: 300;
            margin-bottom: 30px; letter-spacing: 2px; color: #222;
        }

        /* 降維打擊區塊：留白藝術 */
        .focus-box {
            margin: 60px 0; padding: 40px;
            background: #000; color: #fff;
            letter-spacing: 3px; line-height: 2.2;
        }

        /* 手機導覽：藝術圓環 */
        .mobile-nav {
            display: none; position: fixed; bottom: 30px; 
            width: 80%; height: 60px; background: #fff;
            border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 2000; justify-content: space-around; align-items: center;
        }
        .m-item { font-size: 0.8rem; letter-spacing: 2px; color: #999; cursor: pointer; }
        .m-item.active { color: #000; font-weight: 700; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-header { display: none; }
            .mobile-nav { display: flex; left: 10%; }
            .art-card { padding: 40px 20px; }
            .art-main-title { font-size: 1.8rem; letter-spacing: 6px; }
            .art-p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="nav-header">
        <div class="nav-box" id="pc-nav"></div>
    </header>

    <main id="content-target">
        <div class="art-header">
            <span id="art-tag" class="art-tag">DIMENSION SHIFT</span>
            <h1 id="art-title" class="art-main-title">合作價值提案</h1>
        </div>

        <div class="art-card" id="page-content">
            </div>
    </main>

    <div class="mobile-nav" id="mb-nav"></div>
</div>

<script>
    const pages = [
        {
            tag: "CHAPTER 01 / VITALITY",
            title: "合作價值提案",
            content: `
                <span class="section-title">維度提升的藝術</span>
                <div class="art-p">
                    在美髮產業中，絕大多數人的成長邏輯是<b>「線性的」</b>。<br>
                    從勞力競爭躍遷到系統競爭，這不是努力的結果，而是維度的進化。
                </div>
                <div class="focus-box">
                    維度提升 = 降維打擊。<br>
                    書本（理論） + App（工具） + 公司化（槓桿）<br>
                    我們要的不是更多的工作，而是生命的新維度。
                </div>
            `
        },
        {
            tag: "CHAPTER 02 / SYSTEM",
            title: "系統開發者",
            content: `
                <span class="section-title">手藝人 → 系統開發者</span>
                <div class="art-p">
                    專研剪燙染是時間換錢。我跳出技術本身，去開發產業的「大腦」。<br><br>
                    當經營邏輯寫成了 <b style="font-size:1.5rem">8 個 App</b>，技術不再只是記憶，而是自動運行的工具。
                </div>
            `
        },
        {
            tag: "CHAPTER 03 / PLATFORM",
            title: "平台生態",
            content: `
                <span class="section-title">個體教學 → 平台生態</span>
                <div class="art-p">
                    孤立教學會創造競爭對手，而平台會創造合作夥伴。<br><br>
                    三本著作、專案講師、數位系統。<br>我成了美業的「基礎設施提供者」。
                </div>
            `
        },
        {
            tag: "CHAPTER 04 / LEVERAGE",
            title: "數位槓桿",
            content: `
                <span class="section-title">實體資產 → 數位槓桿</span>
                <div class="art-p">
                    借錢開分店是重擔。我用線上課程無限複製。<br><br>
                    透過<b>「天羅地網」</b>，用網路結合實體，讓客人從雲端走向妳。
                </div>
            `
        },
        {
            tag: "CHAPTER 05 / DATA",
            title: "數據資產",
            content: `
                <span class="section-title">主觀經驗 → 數據資產</span>
                <div class="art-p">
                    經營不該靠感覺。透過 8 個 App，將模糊的經驗轉化為精確的權威。<br><br>
                    回流、分潤、庫存。時代，就在<b> 10 位種子學員</b> 的腳下。
                </div>
            `
        }
    ];

    const menu = ["提案", "系統", "生態", "槓桿", "數據"];

    function init() {
        const pc = document.getElementById('pc-nav');
        const mb = document.getElementById('mb-nav');
        pc.innerHTML = menu.map((m, i) => `<div class="nav-item ${i===0?'active':''}" onclick="setPage(${i})">${m}</div>`).join('');
        mb.innerHTML = menu.map((m, i) => `<div class="m-item ${i===0?'active':''}" onclick="setPage(${i})">${m}</div>`).join('');
        setPage(0);
    }

    function setPage(i) {
        const content = document.getElementById('page-content');
        const title = document.getElementById('art-title');
        const tag = document.getElementById('art-tag');
        
        content.style.opacity = 0;
        
        setTimeout(() => {
            title.innerText = pages[i].title;
            tag.innerText = pages[i].tag;
            content.innerHTML = pages[i].content;
            content.style.opacity = 1;
            
            document.querySelectorAll('.nav-item, .m-item').forEach((el, idx) => {
                el.classList.toggle('active', (idx % 5) === i);
            });
        }, 300);
    }

    init();
</script>
</body>
</html>
