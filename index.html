<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活力美髮學堂 - 維度躍遷戰略</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400&family=Noto+Sans+TC:wght@300;400&display=swap');

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Noto Serif TC', serif; overflow: hidden; background-color: #fff; color: #000; }
        
        .app-container {
            display: flex; 
            flex-direction: column;
            height: 100vh;
            background: white linear-gradient(105deg, #fff 0%, #f9f9f9 25%, #fceae6 40%, #fbc2eb 60%, #a1c4fd 85%, #c2e9fb 100%);
            background-attachment: fixed;
        }

        /* --- 頂部導航 --- */
        .nav-header {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(20px); 
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        
        .nav-box { display: flex; gap: 15px; }

        .nav-item { 
            padding: 5px 12px; 
            cursor: pointer; 
            color: #000;
            letter-spacing: 1px; 
            transition: 0.4s; 
            font-weight: 300; 
            font-size: 0.95rem;
        }
        
        .nav-item:hover { color: #6c5ce7; }
        .nav-item.active { color: #6c5ce7; border-bottom: 1px solid #6c5ce7; }

        /* --- 內容顯示區 --- */
        #content-target { 
            flex: 1; 
            width: 100%;
            overflow-y: auto; 
            padding: 50px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .ebook-page {
            max-width: 850px;
            width: 85%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            padding: 65px 75px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.02);
            border: 0.5px solid rgba(0,0,0,0.05);
            margin-bottom: 60px;
            line-height: 2.3; /* 增加行高配合大字 */
            letter-spacing: 1.5px;
            transition: opacity 0.5s ease;
        }

        .page-title { font-size: 1.85rem; margin-bottom: 45px; text-align: center; color: #000; font-weight: 400; letter-spacing: 3px; }
        
        /* 內文字級調大 */
        .text-content { font-size: 1.25rem; color: #111; font-weight: 300; margin-bottom: 30px; text-align: justify; white-space: pre-wrap; }
        
        .summary-highlight {
            background: rgba(108, 92, 231, 0.05);
            padding: 40px;
            border: 0.5px solid rgba(108, 92, 231, 0.2);
            margin: 45px 0;
            font-size: 1.2rem;
            line-height: 2.4;
        }

        .vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 35px; border-top: 0.5px solid #eee; padding-top: 35px; }
        .vs-label { font-size: 0.9rem; color: #888; text-transform: uppercase; margin-bottom: 12px; display: block; font-weight: 400; }
        
        /* 對比區塊大字 */
        .vs-content { font-size: 1.15rem; color: #111; line-height: 2.1; font-weight: 300; }
        .premium-text { color: #6c5ce7; font-weight: 400; }

        /* 手機版導航 */
        .mobile-nav { display: none; position: fixed; width: 100%; left: 0; background: rgba(255,255,255,0.95); z-index: 2000; }
        #mobile-top { top: 0; border-bottom: 0.5px solid #eee; text-align: center; line-height: 60px; font-weight: 300; color: #000; font-size: 1rem; letter-spacing: 2px; }
        #mobile-bottom { bottom: 0; border-top: 0.5px solid #eee; padding-bottom: env(safe-area-inset-bottom); }
        .mobile-nav-list { display: flex; justify-content: space-around; height: 60px; }
        .m-btn { flex: 1; text-align: center; color: #888; display: flex; flex-direction: column; justify-content: center; cursor: pointer; font-size: 0.85rem; }
        .m-btn.active { color: #6c5ce7; font-weight: 400; }

        @media (max-width: 768px) {
            .nav-header { display: none; }
            .mobile-nav { display: block; }
            #content-target { margin-top: 60px; margin-bottom: 60px; padding: 20px 0; }
            .ebook-page { padding: 45px 25px; width: 92%; }
            .text-content { font-size: 1.15rem; }
            .vs-content { font-size: 1.1rem; }
            .vs-grid { grid-template-columns: 1fr; gap: 35px; }
            .page-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="nav-header">
        <div class="nav-box">
            <div class="nav-item active" onclick="showPage(0)">合作價值提案</div>
            <div class="nav-item" onclick="showPage(1)">系統開發者</div>
            <div class="nav-item" onclick="showPage(2)">平台生態</div>
            <div class="nav-item" onclick="showPage(3)">數位槓桿</div>
            <div class="nav-item" onclick="showPage(4)">數據資產</div>
        </div>
    </header>

    <div id="mobile-top" class="mobile-nav">VITALITY ACADEMY</div>

    <main id="content-target">
        <div class="ebook-page" id="page-content">
            </div>
    </main>

    <nav id="mobile-bottom" class="mobile-nav">
        <div class="mobile-nav-list">
            <div class="m-btn active" onclick="showPage(0)">提案</div>
            <div class="m-btn" onclick="showPage(1)">系統</div>
            <div class="m-btn" onclick="showPage(2)">生態</div>
            <div class="m-btn" onclick="showPage(3)">槓桿</div>
            <div class="m-btn" onclick="showPage(4)">數據</div>
        </div>
    </nav>
</div>

<script>
    const pages = [
        {
            title: "「合作價值提案」",
            content: `
                <div class="text-content"><b>何謂美髮業極少人能做到的「維度提升」</b>
在美髮產業中，絕大多數人的成長邏輯是「線性的」：技術更好→收費更高→開店（投入更多勞力）。而我所做的「維度提升」，是直接打破這個天花板，從勞力競爭躍遷到系統競爭。具體來說，我完成了以下四個維度的跨越：</div>
                
                <div class="summary-highlight">
                    <b>總結來說</b><br>
                    維度提升 = 降維打擊。<br>
                    當其他美髮人還在泥淖裡辛苦勞作、煩惱員工離職或客戶流失時，我是站在高處，透過「書本（理論）」+「App（工具）」+「公司化（槓桿）」這三位一體的系統在俯瞰戰場。<br><br>
                    我們要的不是「更多的工作」，而是一個「新的生命維度」（既賺到錢，又有生活品質的快意人生）。
                </div>

                <div class="text-content">我用這四個「維度提升」的優勢，形成一份「合作價值提案」嗎？
加入我的學堂，不是來打工，而是來升級你們的商業維度！</div>
            `
        },
        {
            title: "1. 從「手藝人」提升至「系統開發者」",
            content: `
                <div class="vs-grid">
                    <div class="vs-content"><span class="vs-label">一般人：手藝人思維</span>專研剪燙染，目標是成為名師。這依然是用「時間換錢」，手停，錢就停。</div>
                    <div class="vs-content premium-text"><span class="vs-label">我的維度：系統開發思維</span>我跳出技術本身，去開發 Montor 1.0 & 2.0。我是在為產業設計「大腦」。當別人的技術是存在腦袋裡，我的經營邏輯已經寫成了 8 個 App。過去我只是教人怎麼剪，現在的我，是直接給你們一套自動運行的獲利工具。</div>
                </div>
            `
        },
        {
            title: "2. 從「個體教學」提升至「平台生態」",
            content: `
                <div class="vs-grid">
                    <div class="vs-content"><span class="vs-label">一般人：孤立教學</span>開課教學生，學生學完就走，甚至變成競爭對手。</div>
                    <div class="vs-content premium-text"><span class="vs-label">我的維度：平台生態思維</span>我建立的是「活力美髮學堂」平台。<br>
・技術層面：有三本著作作為標準。<br>
・講師層面：我設計了「專案講師」制度，讓能為自己工作。<br>
・資源層面：提供場地與數位系統，我成了美業的「基礎設施提供者」</div>
                </div>
            `
        },
        {
            title: "3. 從「實體資產」提升至「數位槓桿」",
            content: `
                <div class="vs-grid">
                    <div class="vs-content"><span class="vs-label">一般人：擴張思維</span>想要擴張就得借錢開分店，背負龐大的房租與人事成本（重資產）。</div>
                    <div class="vs-content premium-text"><span class="vs-label">我的維度：槓桿思維</span>我實施的是「輕資產、高槓桿」模式。<br>
・透過線上課程（Montor 2.0）無限複製我的經營邏輯。<br>
・教學場地可以是專案老師的，也可以是學堂的，靈活調度。<br>
・未來還有秘密武器-美業平台入口，客人來自網路上，用網路結合實體店面，稱為天羅地網。</div>
                </div>
            `
        },
        {
            title: "4. 從「主觀經驗」提升至「數據資產」",
            content: `
                <div class="vs-grid">
                    <div class="vs-content"><span class="vs-label">一般人：直覺經營</span>經營靠感覺，今天客人多不多？利潤剩多少？通常要到月底看存摺才知道。</div>
                    <div class="vs-content premium-text"><span class="vs-label">我的維度：數據思維</span>透過 1.0 的導師平台與 2.0 學堂數位助理的 8 個 App，我將模糊的經驗轉化為精確的數據。<br>
・我能看見客戶的回流規律、分潤的精確數值、庫存的流動。<br>
・數據就是權威，成為我的 10 位種子學員，學習數位經營管理，時代就在你的腳下。</div>
                </div>
            `
        }
    ];

    function showPage(index) {
        const target = document.getElementById('page-content');
        target.style.opacity = 0;
        
        setTimeout(() => {
            target.innerHTML = `
                <h1 class="page-title">${pages[index].title}</h1>
                ${pages[index].content}
            `;
            target.style.opacity = 1;
            document.getElementById('content-target').scrollTop = 0;
        }, 300);

        document.querySelectorAll('.nav-item, .m-btn').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-header .nav-item')[index].classList.add('active');
        document.querySelectorAll('.mobile-nav .m-btn')[index].classList.add('active');
    }

    showPage(0);
</script>

</body>
</html>
